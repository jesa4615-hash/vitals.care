name: Build AuraCare Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: auracare-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build AuraCare Android APK
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          java -version

          if ! npx cap --version; then
            echo "ERROR: Capacitor CLI is not available."
            exit 1
          fi

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html does not exist."
            exit 1
          fi

          echo "Web build successful:"
          find dist -maxdepth 3 -type f -print

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -f capacitor.config.ts ]; then
            echo "Found capacitor.config.ts"
          elif [ -f capacitor.config.json ]; then
            echo "Found capacitor.config.json"
          elif [ -f capacitor.config.js ]; then
            echo "Found capacitor.config.js"
          else
            echo "ERROR: No Capacitor configuration file found."
            exit 1
          fi

      - name: Ensure Android platform exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Validate Android project
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Android Gradle wrapper not found."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "ERROR: Debug APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" "release/AuraCare-Health-Assistant-debug.apk"

          echo "APK prepared successfully:"
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraCare-Health-Assistant-APK
          path: release/AuraCare-Health-Assistant-debug.apk
          if-no-files-found: error
          retention-days: 30
