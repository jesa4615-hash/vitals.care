name: Build AuraCare Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: auracare-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build AuraCare Android APK
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Node.js 24
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24


      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install


      # --------------------------------------------------
      # Verify environment
      # --------------------------------------------------

      - name: Verify environment
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "Capacitor:"
          npx cap --version


      # --------------------------------------------------
      # Build web application
      # --------------------------------------------------

      - name: Build web application
        run: npm run build


      # --------------------------------------------------
      # Verify Vite output
      # --------------------------------------------------

      - name: Verify web build
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html does not exist."
            exit 1
          fi

          echo "Web build successful."

          find dist -maxdepth 2 -type f -print


      # --------------------------------------------------
      # Verify Capacitor config
      # --------------------------------------------------

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          test -f capacitor.config.ts

          echo "capacitor.config.ts found."


      # --------------------------------------------------
      # Create Android project
      # --------------------------------------------------

      - name: Add Android platform
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi


      # --------------------------------------------------
      # Capacitor sync
      # --------------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android


      # --------------------------------------------------
      # Check Android project
      # --------------------------------------------------

      - name: Validate Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew does not exist."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # --------------------------------------------------
      # Find APK
      # --------------------------------------------------

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK count: $APK_COUNT"


      # --------------------------------------------------
      # Rename APK
      # --------------------------------------------------

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            "release/AuraCare-Health-Assistant-debug.apk"

          ls -lh release/


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraCare-Health-Assistant
          path: release/AuraCare-Health-Assistant-debug.apk
          if-no-files-found: error
          retention-days: 30
