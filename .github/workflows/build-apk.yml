name: Build AuraCare Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: auracare-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build AuraCare APK
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js 24
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # ---------------------------------------------------------
      # 3. Java 17 for Android/Gradle
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 4. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. Install npm dependencies
      #
      # Uses npm ci ONLY when package-lock.json exists.
      # Otherwise falls back to npm install.
      # ---------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "No package-lock.json found."
            echo "Using npm install."
            npm install
          fi

      # ---------------------------------------------------------
      # 6. Ensure Capacitor is installed
      # ---------------------------------------------------------
      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          if npm list @capacitor/core >/dev/null 2>&1; then
            echo "Capacitor already installed."
          else
            npm install @capacitor/core @capacitor/android
          fi

          if npm list @capacitor/cli >/dev/null 2>&1; then
            echo "Capacitor CLI already installed."
          else
            npm install --save-dev @capacitor/cli
          fi

      # ---------------------------------------------------------
      # 7. Verify Node/npm
      # ---------------------------------------------------------
      - name: Verify Node environment
        run: |
          node --version
          npm --version
          npx cap --version

      # ---------------------------------------------------------
      # 8. Build Vite application
      # ---------------------------------------------------------
      - name: Build web application
        run: npm run build

      # ---------------------------------------------------------
      # 9. Validate web output
      # ---------------------------------------------------------
      - name: Verify web build
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Web build verified successfully."
          find dist -maxdepth 2 -type f | head -50

      # ---------------------------------------------------------
      # 10. Check Capacitor configuration
      # ---------------------------------------------------------
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          if [ -f capacitor.config.ts ]; then
            echo "Found capacitor.config.ts"
          elif [ -f capacitor.config.json ]; then
            echo "Found capacitor.config.json"
          else
            echo "ERROR: No Capacitor configuration found."
            echo "Create capacitor.config.ts in the project root."
            exit 1
          fi

      # ---------------------------------------------------------
      # 11. Create Android platform if missing
      # ---------------------------------------------------------
      - name: Prepare Android platform
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            echo "Android platform does not exist."
            npx cap add android
          fi

      # ---------------------------------------------------------
      # 12. Sync web application into Android
      # ---------------------------------------------------------
      - name: Capacitor sync
        run: npx cap sync android

      # ---------------------------------------------------------
      # 13. Validate Android Gradle wrapper
      # ---------------------------------------------------------
      - name: Validate Gradle project
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 14. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 15. Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK successfully generated."

      # ---------------------------------------------------------
      # 16. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auracare-health-assistant-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
