name: Build AuraCare APK

on:
  workflow_dispatch:
  push:
    paths:
      - "auracare-health-assistant.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  CAPACITOR_VERSION: "7.4.4"
  APP_DIR: "app"
  APK_PATH: "app/android/app/build/outputs/apk/release/app-release.apk"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded AuraCare resources
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f auracare-health-assistant.zip

          unzip -t auracare-health-assistant.zip >/dev/null

          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR"

          unzip -q auracare-health-assistant.zip -d "$APP_DIR"

          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/index.html"
          test -f "$APP_DIR/src/App.tsx"
          test -f "$APP_DIR/src/main.tsx"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Install web dependencies
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --no-audit --no-fund

      - name: Install pinned Capacitor dependencies
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/android@${CAPACITOR_VERSION}" \
            "@capacitor/cli@${CAPACITOR_VERSION}" \
            --save-exact \
            --no-audit \
            --no-fund

      - name: Configure Capacitor
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.auracare.healthassistant',
            appName: 'AuraCare',
            webDir: 'dist',
            bundledWebRuntime: false,
            android: {
              backgroundColor: '#f8fafc'
            }
          };

          export default config;
          EOF

      - name: Make API endpoint configurable
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("src/App.tsx"),
              Path("src/components/FirstAidLibrary.tsx"),
              Path("src/components/HealthChat.tsx"),
          ]

          declaration = """
          const API_BASE_URL = (import.meta.env.VITE_API_BASE_URL || '').replace(/\\/$/, '');
          """

          for path in files:
              text = path.read_text(encoding="utf-8")

              if "API_BASE_URL" not in text:
                  text = declaration + "\n" + text

              text = text.replace(
                  "fetch('/api/",
                  "fetch(`${API_BASE_URL}/api/"
              )

              path.write_text(text, encoding="utf-8")
          PY

      - name: Build web application
        working-directory: app
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -Eeuo pipefail

          npm run build

          test -d dist
          test -f dist/index.html

      - name: TypeScript audit
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          npx tsc --noEmit

      - name: Add Android platform
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          npx cap add android

          test -d android
          test -f android/gradlew

      - name: Configure Android SDK
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              replacements = {
                  "compileSdkVersion = 34": "compileSdkVersion = 35",
                  "targetSdkVersion = 34": "targetSdkVersion = 35",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              p.write_text(text, encoding="utf-8")
          PY

      - name: Sync Capacitor
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          npx cap sync android

          test -d android/app/src/main
          test -d android/app/src/main/assets

      - name: Android project audit
        working-directory: app
        shell: bash
        run: |
          set -Eeuo pipefail

          cd android

          chmod +x gradlew

          ./gradlew --version

          ./gradlew lintDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build release APK
        working-directory: app/android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -Eeuo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache

      - name: Verify APK integrity
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$APK_PATH"

          test -f "$APK"
          test -s "$APK"

          mkdir -p apk-audit

          unzip -t "$APK" >/dev/null

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer apk summary "$APK" | tee apk-audit/summary.txt
          fi

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | tee apk-audit/badging.txt

            grep -q "package: name='com.auracare.healthassistant'" \
              apk-audit/badging.txt

            grep -q "application-label:'AuraCare'" \
              apk-audit/badging.txt || true
          fi

      - name: Verify expected web resources are packaged
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$APK_PATH"

          unzip -l "$APK" > apk-audit/apk-contents.txt

          grep -q "assets/public/index.html" apk-audit/apk-contents.txt \
            || grep -q "assets/index.html" apk-audit/apk-contents.txt

      - name: Copy final APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p release

          cp "$APK_PATH" \
            "release/AuraCare-${GITHUB_RUN_NUMBER}.apk"

          sha256sum \
            "release/AuraCare-${GITHUB_RUN_NUMBER}.apk" \
            > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCare-APK
          path: |
            release/AuraCare-*.apk
            release/SHA256SUMS.txt
            apk-audit/*
          if-no-files-found: error
          retention-days: 30

      - name: Final build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "release/AuraCare-${GITHUB_RUN_NUMBER}.apk"
          test -s "release/AuraCare-${GITHUB_RUN_NUMBER}.apk"

          echo "========================================"
          echo "AuraCare APK BUILD PASSED"
          echo "========================================"
          echo "APK: release/AuraCare-${GITHUB_RUN_NUMBER}.apk"
          echo "SHA256:"
          cat release/SHA256SUMS.txt
          echo "========================================"

# Next: commit this workflow and auracare-health-assistant.zip to the GitHub repository,
# then run "Build AuraCare APK" from Actions -> Run workflow.
